path:
  ckpt_path: ./checkpoints
  log_path: /content/drive/MyDrive/fs2/output/English/log
  result_path: /content/drive/MyDrive/fs2/output/English/result
optimizer:
  batch_size: 16
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 2000
  anneal_steps:
  - 20000
  - 30000
  - 35000
  anneal_rate: 0.3
step:
  total_step: 40000
  log_step: 100
  synth_step: 2000
  val_step: 500
  save_step: 1000
